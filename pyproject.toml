[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadvmh"
version = "0.1.0"
description = "Counterfactual Affective Dual-View Transformer research framework"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "transformers>=4.40",
  "tokenizers>=0.19",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "pandas>=2.1",
  "datasets>=3.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
