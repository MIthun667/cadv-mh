project:
  name: cadvmh
  output_root: experiments_v2
  seed: 42
data:
  train_fraction: 0.70
  validation_fraction: 0.10
  test_fraction: 0.20
  split_seed: 42
model:
  encoder_name: roberta-base
  max_length: 128
  selector_hidden_dim: 256
  dropout: 0.1                 # applied to pooling, selector, heads and interaction
  interaction_dim: 768
  selection_mode: budgeted_st   # train: exact-budget hard top-k forward, binary-concrete backward
  selection_ratio: 0.20
  temperature_initial: 1.0
  temperature_final: 0.3        # reached at the last stage-3 epoch (linear anneal over stages 2+3)
  gradient_checkpointing: true
training:
  microbatch_size: 4
  gradient_accumulation: 4
  encoder_learning_rate: 0.00002
  stage3_encoder_learning_rate: 0.00001
  selector_learning_rate: 0.00005
  module_learning_rate: 0.0001
  weight_decay: 0.01
  gradient_clip: 1.0
  fp16: true
  patience: 2
  beta: 0.999
  stage1_epochs: 2
  stage2_epochs: 2
  stage3_epochs: 5
loss:
  classification: 1.0
  original: 0.5
  necessity: 0.5
  sufficiency: 0.5
  sparsity: 0.0                 # inert/forbidden with budgeted_st (exact budget); >0 only for legacy soft modes
  continuity: 0.05
  consistency: 0.1
  necessity_margin: 0.2
